name: CI

# 仅 PR 触发：推送（含合并到 main）的全流程由 release.yml 负责（测试 → 标签 → 镜像 → APK）
on:
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # 用 npm install 而非 npm ci：在 package.json 与 lock 短暂不同步时（如新增依赖）
      # 也能正常安装，避免 CI 因 lock 漂移直接失败。
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # asyncio_mode=auto：让异步测试用例无需逐个加 @pytest.mark.asyncio 也能运行
      - name: Run tests
        run: pytest -q -o asyncio_mode=auto
