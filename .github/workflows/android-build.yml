name: Android CI (Build & Release APK)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release 版本号（如 Reach-Todo.APP-v0.0.21）。留空则自动计算下一个 V0.0.X'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate fixed debug keystore (deterministic signature across builds)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi

      - name: Provide google-services.json
        run: |
          TARGET="${{ github.workspace }}/android/app/google-services.json"
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON }}" > "$TARGET"
          else
            printf '%s' '{"project_info":{"project_number":"000000000000","project_id":"reach-todo-placeholder","storage_bucket":"reach-todo-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.zjx93.reach"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyD000000000000000000000000000000000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > "$TARGET"
          fi

      - name: Compute version (auto V0.0.X, 第三位自增)
        id: ver
        shell: bash
        run: |
          # 手动触发且提供了版本号 -> 直接使用；否则自动计算下一个 V0.0.X
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION_INPUT="${{ github.event.inputs.version }}"
          else
            # 取已有 Reach-Todo.APP-v0.0.* 标签中最大的第三位 +1（前两位固定 0.0）
            MAX_PATCH=0
            for t in $(git tag -l 'Reach-Todo.APP-v0.0.*'); do
              p="${t#Reach-Todo.APP-v0.0.}"
              case "$p" in
                ''|*[!0-9]*) continue ;;
              esac
              if [ "$p" -gt "$MAX_PATCH" ]; then MAX_PATCH="$p"; fi
            done
            NEXT=$((MAX_PATCH + 1))
            VERSION_INPUT="Reach-Todo.APP-v0.0.${NEXT}"
          fi

          ANDROID_VERSION=$(echo "$VERSION_INPUT" | sed -n 's/.*\(v[0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p')
          [ -z "$ANDROID_VERSION" ] && ANDROID_VERSION="v0.0.1"
          IFS='.' read -r MAJ MIN PAT <<< "${ANDROID_VERSION#v}"
          VERSION_CODE=$(( MAJ*10000 + MIN*100 + PAT ))

          echo "version=$VERSION_INPUT" >> "$GITHUB_OUTPUT"
          echo "android_version=${ANDROID_VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION_INPUT (versionCode=$VERSION_CODE)"

      - name: Build with Gradle (assembleDebug)
        run: |
          ./gradlew assembleDebug --no-daemon -PappVersionName="${{ steps.ver.outputs.android_version }}" -PappVersionCode="${{ steps.ver.outputs.version_code }}"

      - name: Rename APK
        id: apk
        shell: bash
        run: |
          VERSION_INPUT="${{ steps.ver.outputs.version }}"
          ANDROID_VERSION=$(echo "$VERSION_INPUT" | sed -n 's/.*\(v[0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p')
          [ -z "$ANDROID_VERSION" ] && ANDROID_VERSION="v0.0.1"
          APK_NAME="Reach-Todo.android-${ANDROID_VERSION}.apk"

          SRC="${{ github.workspace }}/android/app/build/outputs/apk/debug/app-debug.apk"
          DST="${{ github.workspace }}/android/app/build/outputs/apk/debug/${APK_NAME}"
          cp "$SRC" "$DST"

          echo "tag=$VERSION_INPUT" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: android/app/build/outputs/apk/debug/${{ steps.apk.outputs.apk_name }}

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: ${{ steps.apk.outputs.tag }}
          files: android/app/build/outputs/apk/debug/${{ steps.apk.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
