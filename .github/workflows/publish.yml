name: Publish Docker image

on:
  push:
    branches: [main]
  # Android 发版（softprops/action-gh-release 发布 Release）时，镜像打上对应的 X.Y.Z 版本标签
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 X.Y.Z（如 0.0.9，留空则只打 latest + sha，不打版本标签）'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 版本来源：手动输入 > Android 发版标签(Reach-Todo.APP-vX.Y.Z) 提取
      # 注意：release 事件触发时 GITHUB_REF 是默认分支(refs/heads/main)而非 tag，
      #       必须从 github.event.release.tag_name 取版本，否则会自动发版漏打版本标签。
      - name: Derive version
        id: ver
        run: |
          VERSION=""
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#Reach-Todo.APP-v}"
          elif [[ "${GITHUB_REF}" == refs/tags/Reach-Todo.APP-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/Reach-Todo.APP-v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Derived image version: '${VERSION}'"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ steps.ver.outputs.version != '' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
